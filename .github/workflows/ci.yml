name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The whole CI surface is cordon's reusable gate; locally the same gate
  # is scripts/check.sh. The single required check: `cordon / gate`.
  cordon:
    uses: joeseverino/cordon/.github/workflows/cordon-gate.yml@main
